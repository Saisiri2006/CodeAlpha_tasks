<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Flashcard Quiz</h1>

    <div class="flashcard">
        <p id="cardText">Question will appear here</p>
    </div>

    <button id="toggleBtn">Show Answer</button>

    <div class="controls">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
    </div>

    <hr>

    <h2>Add / Edit Flashcards</h2>
    <input type="text" id="questionInput" placeholder="Enter question">
    <input type="text" id="answerInput" placeholder="Enter answer">
    <button id="addBtn">Add Flashcard</button>
    <button id="deleteBtn">Delete Flashcard</button>

    <script src="script.js"></script>
</body>
</html>
